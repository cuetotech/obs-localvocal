name: LocalVocal Windows NVIDIA - tested translation fixes

on:
  workflow_dispatch:
  push:
    branches: [build/nvidia-translation-20261023, feat/rtx4070-sermon-captions, feat/openai-responses-contextual-sermons, experiment/narration-sidecar-20261111]
    paths:
      - '.github/workflows/build-nvidia.yml'
      - '.github/scripts/**'
      - 'src/**'
      - 'tests/regression/**'
      - 'tests/download-qt/**'
      - 'cmake/**'
      - 'CMakeLists.txt'
      - 'CMakePresets.json'
      - 'buildspec.json'
      - 'data/**'
      - 'deps/**'

permissions:
  contents: read
concurrency:
  group: nvidia-translation-${{ github.ref }}
  cancel-in-progress: true

jobs:
  windows-x64-nvidia:
    name: Windows x64 NVIDIA (RelWithDebInfo)
    runs-on: windows-2022
    timeout-minutes: 60
    defaults:
      run:
        shell: pwsh
    env:
      CI: '1'
      ACCELERATION: nvidia
    steps:
      - name: Checkout exact source
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          submodules: recursive
          fetch-depth: 0
          persist-credentials: false

      - name: Build and run translation regression tests
        run: |
          $ErrorActionPreference = 'Stop'
          cmake -S tests/regression -B build-regression -A x64
          if ($LASTEXITCODE -ne 0) { throw 'Test configure failed' }
          cmake --build build-regression --config Release
          if ($LASTEXITCODE -ne 0) { throw 'Test compile failed' }
          ctest --test-dir build-regression -C Release --output-on-failure
          if ($LASTEXITCODE -ne 0) { throw 'Regression tests failed' }

      - name: Test experimental narration sidecar (dry run, no audio)
        run: |
          python -m unittest discover -s tools/narration -p test_narrator.py -v
          if ($LASTEXITCODE -ne 0) { throw 'Narration unit tests failed' }

      - name: Initialize Rust toolchain
        uses: actions-rust-lang/setup-rust-toolchain@166cdcfd11aee3cb47222f9ddb555ce30ddb9659
        with:
          cache: false
          rustflags: ''

      - name: Build Windows x64 NVIDIA
        run: |
          $env:ACCELERATION = 'nvidia'
          ./.github/scripts/Build-Windows.ps1 -Target x64 -Configuration RelWithDebInfo

      - name: Verify Responses API typed output and usage contract
        run: |
          $ErrorActionPreference = 'Stop'
          cmake -S . -B build_x64 -DENABLE_RESPONSE_TESTS=ON
          if ($LASTEXITCODE -ne 0) { throw 'Responses parser configure failed' }
          cmake --build build_x64 --config RelWithDebInfo --target localvocal_openai_response_tests
          if ($LASTEXITCODE -ne 0) { throw 'Responses parser compile failed' }
          & ./build_x64/tests/responses/RelWithDebInfo/localvocal_openai_response_tests.exe
          if ($LASTEXITCODE -ne 0) { throw 'Responses parser fixture tests failed' }

      - name: Test real Qt and curl download worker against local HTTP fixtures
        run: |
          $ErrorActionPreference = 'Stop'
          cmake -S . -B build_x64 -DENABLE_DOWNLOAD_TESTS=ON
          if ($LASTEXITCODE -ne 0) { throw 'Download test configure failed' }
          cmake --build build_x64 --config RelWithDebInfo --target localvocal_download_qt_tests
          if ($LASTEXITCODE -ne 0) { throw 'Download test compile failed' }
          & ./build_x64/download-tests/RelWithDebInfo/localvocal_download_qt_tests.exe
          if ($LASTEXITCODE -ne 0) { throw 'Download worker tests failed' }

      - name: Verify CUDA build selection and installed libraries
        run: |
          $ErrorActionPreference = 'Stop'
          $cache = Get-Content -Raw build_x64/CMakeCache.txt
          if ($cache -notmatch '(?m)^ACCELERATION:STRING=nvidia\s*$') { throw 'Not an NVIDIA configure' }
          $project = Get-Content -Raw build_x64/obs-localvocal.vcxproj
          if (-not $project.Contains('POLYGLOT_WITH_CUDA')) { throw 'CT2 CUDA macro missing' }
          $names = @(Get-ChildItem release/RelWithDebInfo -Recurse -Filter '*.dll' | ForEach-Object Name)
          foreach ($required in @('obs-localvocal.dll', 'ctranslate2.dll', 'ggml-cuda.dll')) {
            if ($names -notcontains $required) { throw "Required library missing: $required" }
          }
          $names | Sort-Object

      - name: Package NVIDIA installer and ZIP
        run: |
          ./.github/scripts/Package-Windows.ps1 -Target x64 -Configuration RelWithDebInfo -Acceleration nvidia -BuildInstaller

      - name: Record provenance and checksums
        run: |
          $ErrorActionPreference = 'Stop'
          $spec = Get-Content -Raw buildspec.json | ConvertFrom-Json
          $base = "release/$($spec.name)-$($spec.version)-windows-x64-nvidia"
          $files = @("$base.zip", "$base-Installer.exe")
          $lines = foreach ($file in $files) {
            if (-not (Test-Path $file)) { throw "Package missing: $file" }
            $hash = Get-FileHash $file -Algorithm SHA256
            "$($hash.Hash.ToLower())  $(Split-Path $file -Leaf)"
          }
          $lines | Set-Content release/SHA256SUMS.txt -Encoding utf8
          @(
            "Source: $env:GITHUB_SHA",
            "Run: https://github.com/$env:GITHUB_REPOSITORY/actions/runs/$env:GITHUB_RUN_ID",
            'Configuration: Windows x64 NVIDIA RelWithDebInfo',
            'CUDA build selection and DLL presence checked; GPU inference and OBS runtime NOT tested by CI.'
          ) | Set-Content release/BUILDINFO.txt -Encoding utf8

      - name: Audit model payload and individual package sizes
        run: |
          $ErrorActionPreference = 'Stop'
          $spec = Get-Content -Raw buildspec.json | ConvertFrom-Json
          $base = "release/$($spec.name)-$($spec.version)-windows-x64-nvidia"
          $portable = Get-Item "$base.zip"
          $installer = Get-Item "$base-Installer.exe"
          $models = @(Get-ChildItem release/RelWithDebInfo -Recurse -File -Filter '*.bin')
          $turbo = @($models | Where-Object { $_.Name -match '(?i)large-v3-turbo' })
          if ($turbo.Count -ne 0) { throw "Unexpected bundled Whisper Turbo model weights" }
          $largest = @(Get-ChildItem release/RelWithDebInfo -Recurse -File |
            Sort-Object Length -Descending | Select-Object -First 12)
          $lines = @(
            "Source: $env:GITHUB_SHA",
            "Portable ZIP: $($portable.Length) bytes ($([math]::Round($portable.Length / 1MB, 1)) MiB)",
            "Installer EXE: $($installer.Length) bytes ($([math]::Round($installer.Length / 1MB, 1)) MiB)",
            'Bundled model .bin files (non-Turbo):'
          )
          foreach ($model in $models) {
            $lines += "  $($model.Name): $($model.Length) bytes"
          }
          $lines += 'Largest installed files:'
          foreach ($file in $largest) {
            $lines += "  $($file.Name): $($file.Length) bytes"
          }
          $lines += 'Turbo V3 weights not bundled; separate on-demand download.'
          $lines | Set-Content release/PACKAGE-MANIFEST.txt -Encoding utf8
          $lines | Write-Output

      - name: Upload portable NVIDIA ZIP
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: LocalVocal-Portable-NVIDIA-${{ github.sha }}
          path: |
            release/*-windows-x64-nvidia.zip
            release/SHA256SUMS.txt
            release/BUILDINFO.txt
            release/PACKAGE-MANIFEST.txt
          if-no-files-found: error
          retention-days: 30

      - name: Upload Windows NVIDIA installer
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: LocalVocal-Installer-NVIDIA-${{ github.sha }}
          path: |
            release/*-windows-x64-nvidia-Installer.exe
            release/SHA256SUMS.txt
            release/BUILDINFO.txt
            release/PACKAGE-MANIFEST.txt
          if-no-files-found: error
          retention-days: 30
