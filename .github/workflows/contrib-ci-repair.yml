name: Contribution CI repair and ONNX package inventory
on:
  push:
    branches: [contrib/upstream-reliability-super-pr-20261119]
  pull_request:
    branches: [master]
permissions:
  contents: write
jobs:
  apply-upstream-format:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.ref || github.ref_name }}
          persist-credentials: true
      - name: Apply upstream formatters
        run: |
          set -euo pipefail
          eval "$(/home/linuxbrew/.linuxbrew/bin/brew shellenv)"
          brew install --quiet obsproject/tools/clang-format@16
          python3 -m pip install --user --break-system-packages cmakelang==0.6.13
          export PATH="/home/linuxbrew/.linuxbrew/opt/clang-format@16/bin:$HOME/.local/bin:$PATH"
          clang-format-16 -i src/transcription-filter.cpp src/translation/cloud-translation/google-cloud.cpp src/translation/cloud-translation/html-entities.h src/translation/translation.cpp
          cmake-format -i src/tests/CMakeLists.txt tests/upstream-reliability/CMakeLists.txt
          git diff --check
          git status --short
      - name: Commit formatted source
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/transcription-filter.cpp src/translation/cloud-translation/google-cloud.cpp src/translation/cloud-translation/html-entities.h src/translation/translation.cpp src/tests/CMakeLists.txt tests/upstream-reliability/CMakeLists.txt
          if ! git diff --cached --quiet; then
            git commit -m "style: apply upstream clang-format 16 and cmake-format 0.6.13"
            git push origin HEAD:${GITHUB_REF_NAME}
          fi
  inspect-onnx-official-nuget:
    runs-on: ubuntu-22.04
    steps:
      - name: Download and inventory signed Microsoft ONNX Runtime 1.20.1
        run: |
          set -euo pipefail
          pkg=https://api.nuget.org/v3-flatcontainer/microsoft.ml.onnxruntime/1.20.1/microsoft.ml.onnxruntime.1.20.1.nupkg
          curl --fail --location --silent --show-error --retry 3 --max-time 180 "$pkg" --output /tmp/ort-1.20.1.nupkg
          sha256sum /tmp/ort-1.20.1.nupkg
          unzip -Z -1 /tmp/ort-1.20.1.nupkg | grep -E '(build/native/include/onnxruntime|runtimes/(win-x64|linux-x64|osx-arm64|osx-x64)/native/|\.signature\.p7s)' | head -n 100
