name: Temporary ONNX CMake formatter
on:
  pull_request:
    branches: [master]
permissions:
  contents: write
jobs:
  format-onnx:
    if: github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.ref }}
          persist-credentials: true
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Apply cmake-format 0.6.13
        run: |
          set -euo pipefail
          python -m pip install cmakelang==0.6.13
          cmake-format -i cmake/FetchOnnxruntime.cmake
          git diff --check
      - name: Commit formatted file
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -u cmake/FetchOnnxruntime.cmake
          if ! git diff --cached --quiet; then
            git commit -m "style: apply cmake-format to ONNX Runtime dependency changes"
            git push origin HEAD:${{ github.event.pull_request.head.ref }}
          fi
